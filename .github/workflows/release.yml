name: Release APKs

# Builds one APK per ABI (arm64, arm, x86, x64) and publishes them as assets
# on the GitHub Release for the pushed tag.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  NDK_VERSION: "26.3.11579264"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/memory-bench-jni/Cargo.lock') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build per-ABI release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -euo pipefail
          outdir="app/build/outputs/apk/release"
          mkdir -p release-apks
          cp "$outdir/app-arm64-v8a-release.apk" "release-apks/vibe-memory-benchmark-${{ github.ref_name }}-arm64.apk"
          cp "$outdir/app-armeabi-v7a-release.apk" "release-apks/vibe-memory-benchmark-${{ github.ref_name }}-arm.apk"
          cp "$outdir/app-x86-release.apk" "release-apks/vibe-memory-benchmark-${{ github.ref_name }}-x86.apk"
          cp "$outdir/app-x86_64-release.apk" "release-apks/vibe-memory-benchmark-${{ github.ref_name }}-x64.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-apks/*.apk
